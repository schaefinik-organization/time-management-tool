name: CI/CD Pipeline - Time Management Tool

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    # 'synchronize' ist wichtig, damit der Scan bei neuen Commits in einem PR aktualisiert wird
    types: [opened, synchronize, reopened] 

jobs:
  build-and-analyze:
    # Für deine eigenen Runner ändere dies zu: runs-on: self-hosted
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Zwingend erforderlich für SonarQube, um "New Code" von altem Code zu unterscheiden
          fetch-depth: 0  

      - name: Setup Node.js (Vue Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          # Teilt GitHub mit, wo der Lock-File liegt, um den Hash für den Cache zu berechnen
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Java 21 (Spring Boot)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Aktiviert das automatische, hochoptimierte Caching für den ~/.gradle Ordner
          cache: 'gradle' 

      - name: Install Frontend Dependencies (npm ci)
        working-directory: ./frontend
        # npm ci ist schneller und strikter in CI-Umgebungen als npm install
        run: npm ci

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build, Test and Analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # URL zu deiner SonarQube-Instanz, z.B. http://deine-truenas-ip:9000
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }} 
        # Führt durch die Abhängigkeiten in der build.gradle automatisch alle Tests und Scans aus
        run: ./gradlew build sonar --no-daemon

      - name: Login in GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          