name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - main

# Globale Umgebungsvariablen
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # Bsp: dein-user/dein-repo

jobs:
  # ---------------------------------------------------
  # JOB 1: Testen, Bauen und in die Registry pushen
  # ---------------------------------------------------
  build-and-test:
    runs-on: self-hosted
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Login in GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadaten (Tags) generieren
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch # Erzeugt Tags wie 'develop' oder 'main'
            type=sha # Erzeugt einen Tag mit dem Git-Commit-Hash

      - name: Docker Image bauen und pushen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-dev:
    needs: build-and-test
    if: github.ref == 'refs/heads/develop'
    runs-on: self-hosted
    environment: dev
    steps:
      - name: Deploy to DEV Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /pfad/zum/projektordner/auf/dem/server
            
            # .env Datei dynamisch aus GitHub Secrets generieren
            echo "APP_ENV=development" > .env
            echo "API_KEY=${{ secrets.API_KEY }}" >> .env
            
            # Neuestes Image ziehen (Tag: develop) und Container neustarten
            docker compose pull
            docker compose up -d --remove-orphans

  deploy-prod:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: prod
    steps:
      - name: Deploy to PROD Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /pfad/zum/projektordner/auf/dem/server
            
            # .env Datei dynamisch aus GitHub Secrets generieren
            echo "APP_ENV=production" > .env
            echo "API_KEY=${{ secrets.API_KEY }}" >> .env
            
            # Neuestes Image ziehen (Tag: main) und Container neustarten
            docker compose pull
            docker compose up -d --remove-orphans