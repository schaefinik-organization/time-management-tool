name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, tests ]
  pull_request:
    branches: [ main, develop, tests ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-analyze:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Zwingend für SonarQube, um "New Code" zu erkennen

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle' # Aktiviert das Caching für den .gradle Ordner

      - name: Build, Test and SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          cd backend
          chmod +x gradlew
          # Gradle führt hier ALLES aus: Node-Download, npm install, Vue-Build, Java-Build, Tests und Sonar-Scan
          ./gradlew build sonar --no-daemon \
            -Dsonar.projectKey=time-management-tool \
            -Dsonar.projectName="Mein Time Management Tool Backend" \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN

      - name: Login in GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadaten (Tags) generieren
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Docker Image bauen und pushen
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./backend # Behält deinen alten Docker-Kontext bei
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-dev:
    needs: build-and-analyze
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: self-hosted
    environment: dev
    steps:
      - name: Deploy to DEV Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /mnt/raid_pool/configs/GitHub-runner
            echo "APP_ENV=development" > .env
            docker compose pull
            docker compose up -d --remove-orphans

  deploy-prod:
    needs: build-and-analyze
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    environment: prod
    steps:
      - name: Deploy to PROD Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /mnt/raid_pool/configs/GitHub-runner-prod
            echo "APP_ENV=production" > .env
            docker compose pull
            docker compose up -d --remove-orphans