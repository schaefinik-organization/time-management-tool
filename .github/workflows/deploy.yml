name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        run: |
          cd backend
          ./gradlew build

      - name: Deploy to DEV
        if: github.ref == 'refs/heads/develop'
        env:
          SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
        run: |
          echo "Hier SSH-Befehl zum Server: ./deploy-manage.sh deploy dev"

      - name: Deploy to PROD
        if: github.ref == 'refs/heads/main'
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          echo "Hier SSH-Befehl zum Server: ./deploy-manage.sh deploy prod"