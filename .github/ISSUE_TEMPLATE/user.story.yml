name: 🚀 User Story / Feature
description: Reiche ein neues Feature oder eine User Story für das Time Management Tool ein.
title: "[FEATURE] <Titel hier eingeben>"
labels: [ "enhancement", "user-story" ]
body:
  - type: markdown
    attributes:
      value: |
        ## Neue User Story
        Bitte fülle die Felder so präzise wie möglich aus, um die Implementierung in Spring Boot und Vue.js optimal planen zu können.

  - type: dropdown
    id: epic
    attributes:
      label: 📂 Epic / Themenbereich
      description: Zu welcher Phase gehört dieses Feature?
      options:
        - "Epic 1: Qualitätssicherung & Alpha-Freeze"
        - "Epic 2: Refinement der Web-Reports"
        - "Epic 3: Daten-Export (Excel/PDF)"
        - "Epic 4: Zukünftige Features (Backlog)"
        - "Infrastruktur / CI/CD & Deployment"
    validations:
      required: true

  - type: input
    id: role
    attributes:
      label: 👤 Als... (Rolle)
      placeholder: "z.B. Manager, Admin, User"
    validations:
      required: true

  - type: input
    id: goal
    attributes:
      label: 🎯 möchte ich... (Ziel)
      placeholder: "z.B. ein Kuchendiagramm der Projektzeiten sehen"
    validations:
      required: true

  - type: input
    id: reason
    attributes:
      label: 💡 damit... (Mehrwert/Grund)
      placeholder: "z.B. ich Budgets schneller erfassen und auswerten kann"
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: ✅ Akzeptanzkriterien
      description: Was muss erfüllt sein, damit diese Story als "Done" gilt? (Bitte als Checkliste)
      value: |
        - [ ] Kriterium 1
        - [ ] Kriterium 2
    validations:
      required: true

  - type: textarea
    id: technical_notes
    attributes:
      label: 🛠️ Technische Notizen & Architektur (Optional)
      description: Ideen zur Implementierung (Spring Boot Endpoints, Vue Komponenten, Bibliotheken)
      placeholder: "z.B. Nutze vue-chartjs für das Frontend; Erstelle einen GET-Endpoint für die PDF-Generierung..."

  - type: checkboxes
    id: dod
    attributes:
      label: 🏁 Definition of Done (DoD)
      options:
        - label: Backend-Tests (JUnit/Mockito) sind geschrieben und grün
        - label: Frontend-Tests (Vitest) decken neue Logik ab
        - label: Code hat die statische Analyse (SonarQube) bestanden
        - label: API-Änderungen sind in der Swagger-UI dokumentiert
        - label: Docker-Container bauen weiterhin erfolgreich