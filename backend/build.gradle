plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.node-gradle.node' version '7.1.0'
}

group = 'schaefinik'
version = '0.0.2-ALPHA'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

node {
    version = '22.19.0'
    download = true
    nodeProjectDir = file("${project.projectDir}/frontend")
}

tasks.register('npmInstallFrontend', com.github.gradle.node.npm.task.NpmInstallTask) {
    workingDir = file("${project.projectDir}/frontend")
}

tasks.register('buildFrontend', com.github.gradle.node.npm.task.NpmTask) {
    dependsOn 'npmInstallFrontend'
    workingDir = file("${project.projectDir}/frontend")
    args = ['run', 'build']
}

tasks.register('copyFrontendToStatic', Copy) {
    dependsOn 'buildFrontend'
    from("${project.projectDir}/frontend/dist")
    into("${project.projectDir}/src/main/resources/static")
}

tasks.named('processResources') {
    dependsOn 'copyFrontendToStatic'
}

tasks.named('clean') {
    delete "${project.projectDir}/src/main/resources/static/assets"
    delete "${project.projectDir}/src/main/resources/static/index.html"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    failOnNoDiscoveredTests = false
}
