plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.3'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'com.github.node-gradle.node' version '7.1.0'
}

group = 'schaefinik'
version = '0.0.1-START'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

node {
    version = '22.19.0'
    download = true
    nodeProjectDir = file("${project.projectDir}/frontend")
}

tasks.register('npmInstallFrontend', com.github.gradle.node.npm.task.NpmInstallTask) {
    workingDir = file("${project.projectDir}/frontend")
}

tasks.register('buildFrontend', com.github.gradle.node.npm.task.NpmTask) {
    dependsOn 'npmInstallFrontend'
    workingDir = file("${project.projectDir}/frontend")
    args = ['run', 'build']
}

tasks.register('copyFrontendToStatic', Copy) {
    dependsOn 'buildFrontend'
    from("${project.projectDir}/frontend/dist")
    into("${project.projectDir}/src/main/resources/static")
}

tasks.named('processResources') {
    dependsOn 'copyFrontendToStatic'
}

tasks.named('clean') {
    delete "${project.projectDir}/src/main/resources/static/assets"
    delete "${project.projectDir}/src/main/resources/static/index.html"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    failOnNoDiscoveredTests = false
}
