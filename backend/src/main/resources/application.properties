logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

spring.application.name=time-management-tool

# Standardmäßig ist das "dev" Profil aktiv
spring.profiles.active=dev

# JPA Einstellungen (Basis)
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Konfiguration (Wird in Profilen überschrieben)
app.jwt.expiration-ms=864000000

# Seeding Configuration (Wird von Seedern gelesen)
seed.admin.email=${ADMIN_EMAIL:admin@example.com}
seed.admin.password=${ADMIN_PASSWORD:Admin123!}
seed.test.email=${TESTUSER_EMAIL:test@example.com}
seed.test.password=${TESTUSER_PASSWORD:Test123!}

seed.test.firstJob=${TESTUSER_FIRST_JOB:Coding}
seed.test.secondJob=${TESTUSER_SECOND_JOB:Testing}

# PostgreSQL Verbindung
spring.datasource.url=jdbc:postgresql://localhost:5432/timetracker
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA Einstellungen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect