# Datenbank (Platzhalter für Server-Variablen)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate (In Produktion: validate oder none, niemals update!)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JWT Secret (Muss vom Server kommen!)
app.jwt.secret=${JWT_SECRET}

# CORS: Deine echte Domain (z.B. https://meine-zeiterfassung.de)
app.cors.allowed-origins=${ALLOWED_ORIGINS}

# Logging (Weniger ausführlich)
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO