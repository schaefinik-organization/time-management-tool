# Test Profile Configuration

# Datenbank (H2 für Tests)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate (Test: create-drop für Clean DB nach jedem Test)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Ensure EntityManagerFactory is created
spring.jpa.generate-ddl=true

# JWT Secret (Für Tests)
app.jwt.secret=AkYoumSmE9nr2o2ruqlOnL2Gn/938QH5sxo7sG62CXw=

# Disable Seeding in Tests
app.seeder.enabled=false

logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

